<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18040d"/>
      <stop offset="1" stop-color="#2a0818"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .hud-scan{animation:hudMotion 2.6s ease-in-out infinite alternate}
    @keyframes hudMotion{from{transform:translateY(0)}to{transform:translateY(190px)}}
    .badge-pop{animation:successPop 5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
    @keyframes successPop{
      0%,20%{transform:scale(0.8);opacity:0}
      30%,85%{transform:scale(1);opacity:1}
      95%,100%{transform:scale(0.8);opacity:0}
    }
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Flutter App Shell -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="14" fill="#200614" stroke="#ff7a9f" stroke-opacity="0.35" stroke-width="2"/>

    <!-- App Bar -->
    <rect width="740" height="46" rx="14" fill="#330b20"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="46" cy="23" r="6" fill="#facc15"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>
    <text x="88" y="28" class="mono" font-size="13" font-weight="bold" fill="#ff7a9f">
      SMART ATTENDANCE // FLUTTER + GOOGLE ML KIT BIOMETRIC VERIFICATION
    </text>

    <!-- Left Camera Viewport -->
    <g transform="translate(24, 66)">
      <rect width="360" height="240" rx="8" fill="#0d0208" stroke="#4a122f" stroke-width="2"/>
      
      <!-- Student Face -->
      <g transform="translate(180, 120)">
        <ellipse rx="46" ry="60" fill="#fcd34d" stroke="#18181b" stroke-width="2"/>
        <path d="M-46 -8 C-46 -50 46 -50 46 -8 Z" fill="#18181b"/>
        <ellipse cx="-16" cy="-4" rx="6" ry="8" fill="#18181b"/>
        <ellipse cx="16" cy="-4" rx="6" ry="8" fill="#18181b"/>
        <path d="M-12 24 Q0 34 12 24" stroke="#18181b" stroke-width="3" fill="none"/>
      </g>

      <!-- Biometric Mesh Grid -->
      <g stroke="#ff7a9f" stroke-width="1.5" fill="none" opacity="0.8">
        <circle cx="164" cy="116" r="10"/>
        <circle cx="196" cy="116" r="10"/>
        <circle cx="180" cy="132" r="6"/>
        <line x1="164" y1="116" x2="196" y2="116"/>
        <line x1="164" y1="116" x2="180" y2="132"/>
        <line x1="196" y1="116" x2="180" y2="132"/>
        <line x1="180" y1="132" x2="180" y2="150"/>
      </g>

      <!-- HUD Reticle -->
      <g stroke="#ff7a9f" stroke-width="2" fill="none">
        <path d="M110 50 H130 V70 M250 50 H230 V70 M110 190 H130 V170 M250 190 H230 V170"/>
      </g>

      <!-- Scan Bar -->
      <g class="hud-scan">
        <line x1="0" y1="20" x2="360" y2="20" stroke="#f43f5e" stroke-width="2"/>
      </g>

      <rect x="0" y="215" width="360" height="25" fill="rgba(20,2,12,0.85)"/>
      <text x="12" y="232" class="mono" font-size="11" fill="#ff7a9f">
        ML Kit: Face Mesh 468 Landmarks Active • Match: 99.1%
      </text>
    </g>

    <!-- Right Side Verification Card -->
    <g transform="translate(405, 66)">
      <rect width="310" height="240" rx="8" fill="#15040e" stroke="#4a122f" stroke-width="2"/>
      
      <g class="badge-pop" transform="translate(155, 120)">
        <circle cx="0" cy="-35" r="32" fill="#22c55e"/>
        <path d="M-12 -35 L-4 -27 L14 -45" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <text x="0" y="20" class="ui" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
          ATTENDANCE LOGGED
        </text>
        <text x="0" y="42" class="mono" font-size="12" fill="#4ade80" text-anchor="middle">
          Mohamed Arif J (CSE-2026)
        </text>
        <text x="0" y="62" class="mono" font-size="11" fill="#cbd5e1" text-anchor="middle">
          Timestamp: 09:00:14 AM [VERIFIED]
        </text>
      </g>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 326)">
      <rect width="692" height="78" rx="8" fill="#15040e" stroke="#4a122f" stroke-width="2"/>
      <text x="16" y="26" class="mono" font-size="11" fill="#ff7a9f">
        Cross-Platform: Flutter &amp; Dart Engine • Google ML Kit Vision Models • Windows &amp; Android Target
      </text>
      <text x="16" y="48" class="mono" font-size="11" fill="#f8fafc">
        Offline Encryption: AES-256 local biometric template vault • Zero external cloud dependency
      </text>
      <text x="16" y="68" class="mono" font-size="11" fill="#4ade80">
        ✔ Verified High-Speed Classroom Roll Call (Under 400ms per verification)
      </text>
    </g>
  </g>
</svg>
