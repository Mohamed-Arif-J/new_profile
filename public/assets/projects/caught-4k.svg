<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#005050"/>
    </linearGradient>
    <linearGradient id="winTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="webcamClip"><rect x="18" y="70" width="360" height="240" rx="4"/></clipPath>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .rec-blink{animation:recBlink 1.2s steps(1) infinite}
    @keyframes recBlink{50%{opacity:0}}
    .scan-beam{animation:scanBeam 3s ease-in-out infinite alternate}
    @keyframes scanBeam{from{transform:translateY(0)}to{transform:translateY(238px)}}
    .meme-reveal{animation:memeReveal 6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite}
    @keyframes memeReveal{
      0%,15%{transform:scale(0.85);opacity:0}
      25%,85%{transform:scale(1);opacity:1}
      95%,100%{transform:scale(0.85);opacity:0}
    }
    .stamp{animation:stampIn 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
    @keyframes stampIn{
      0%,28%{transform:rotate(-14deg) scale(2.2);opacity:0}
      35%,85%{transform:rotate(-14deg) scale(1);opacity:1}
      92%,100%{transform:rotate(-14deg) scale(0.8);opacity:0}
    }
  </style>

  <!-- Desktop Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Win95 Main Window -->
  <g transform="translate(30, 20)">
    <!-- Beveled Window Border -->
    <rect width="740" height="430" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="3" filter="drop-shadow(3px 5px 14px rgba(0,0,0,0.4))"/>
    <rect x="2" y="2" width="736" height="426" fill="none" stroke="#808080" stroke-width="2"/>

    <!-- Title Bar -->
    <rect x="4" y="4" width="732" height="28" fill="url(#winTitle)"/>
    <text x="14" y="23" class="ui" font-size="13" font-weight="bold" fill="#ffffff">
      📸 CAUGHT IN 4K - Optical Reaction Parody Appliance [RAGEWARE 98]
    </text>
    <g transform="translate(670, 7)">
      <rect width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="9" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">_</text>
      <rect x="22" y="0" width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="31" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">□</text>
      <rect x="44" y="0" width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="53" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">✕</text>
    </g>

    <!-- Menu Bar -->
    <rect x="4" y="32" width="732" height="22" fill="#d4d0c8"/>
    <text x="14" y="47" class="ui" font-size="11" fill="#000">File   Capture   Optical-Vision   Roast-Engine   Help</text>
    <line x1="4" y1="54" x2="736" y2="54" stroke="#808080" stroke-width="1"/>

    <!-- Left: Live Suspect Webcam Buffer -->
    <g transform="translate(14, 62)">
      <rect width="340" height="240" fill="#080c14" stroke="#808080" stroke-width="2"/>
      <text x="12" y="24" class="mono" font-size="11" fill="#a855f7" font-weight="bold">[LIVE SUSPECT FEED]</text>
      <circle cx="320" cy="20" r="5" fill="#ef4444" class="rec-blink"/>

      <!-- Stylized Suspect Face -->
      <g transform="translate(170, 125)">
        <ellipse rx="52" ry="68" fill="#ffdbac" stroke="#18181b" stroke-width="2"/>
        <path d="M-52 -10 C-52 -55 52 -55 52 -10 Z" fill="#2d1b0d"/>
        <!-- Eyes wide open in shock -->
        <ellipse cx="-20" cy="-6" rx="10" ry="12" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
        <circle cx="-20" cy="-6" r="4" fill="#18181b"/>
        <ellipse cx="20" cy="-6" rx="10" ry="12" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
        <circle cx="20" cy="-6" r="4" fill="#18181b"/>
        <!-- O-shaped mouth -->
        <ellipse cx="0" cy="30" rx="14" ry="18" fill="#581c1c" stroke="#18181b" stroke-width="2"/>
        <!-- Eyebrows raised -->
        <path d="M-32 -26 Q-20 -38 -8 -26" stroke="#18181b" stroke-width="3" fill="none"/>
        <path d="M8 -26 Q20 -38 32 -26" stroke="#18181b" stroke-width="3" fill="none"/>
      </g>

      <!-- Vision AI Tracking Reticle -->
      <g stroke="#a855f7" stroke-width="2" fill="none">
        <path d="M96 50 H120 V74 M244 50 H220 V74 M96 200 H120 V176 M244 200 H220 V176"/>
        <line x1="170" y1="50" x2="170" y2="60"/>
        <line x1="170" y1="190" x2="170" y2="200"/>
        <line x1="96" y1="125" x2="106" y2="125"/>
        <line x1="234" y1="125" x2="244" y2="125"/>
      </g>

      <!-- Scanning Beam -->
      <g class="scan-beam">
        <rect x="0" y="0" width="340" height="20" fill="url(#scanner)"/>
        <line x1="0" y1="20" x2="340" y2="20" stroke="#c084fc" stroke-width="2"/>
      </g>

      <!-- Bottom Tag -->
      <rect x="0" y="218" width="340" height="22" fill="rgba(8,12,20,0.85)"/>
      <text x="10" y="233" class="mono" font-size="10" fill="#a855f7">Moondream2: Shock &amp; Panic Detected (98.4%)</text>
    </g>

    <!-- Right: Roasted Meme Output (Burned in 4K) -->
    <g transform="translate(370, 62)">
      <rect width="350" height="240" fill="#05070a" stroke="#808080" stroke-width="2"/>
      
      <g class="meme-reveal">
        <!-- Meme Poster Canvas -->
        <rect x="15" y="15" width="320" height="210" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
        <!-- Meme Head Snapshot -->
        <rect x="25" y="25" width="300" height="115" fill="#27272a"/>
        <text x="175" y="50" class="ui" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
          WHEN THE SENIOR DEV ASKS
        </text>
        <text x="175" y="70" class="ui" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
          WHO PUSHED DIRECTLY TO PROD:
        </text>
        <text x="175" y="110" class="mono" font-size="18" fill="#facc15" text-anchor="middle">
          👀 😳 💀
        </text>
        <!-- Bottom Burn Roast from Qwen2.5 -->
        <rect x="25" y="145" width="300" height="60" fill="#09090b"/>
        <text x="35" y="166" class="ui" font-size="10" font-weight="bold" fill="#f43f5e">> Qwen2.5 Roast Output:</text>
        <text x="35" y="184" class="ui" font-size="10" fill="#e4e4e7">"Expression telemetry: 100% guilty.</text>
        <text x="35" y="198" class="ui" font-size="10" fill="#e4e4e7">No git rollback can save this face."</text>

        <!-- CAUGHT IN 4K STAMP -->
        <g class="stamp" transform="translate(175, 120)">
          <rect x="-110" y="-24" width="220" height="48" fill="none" stroke="#ef4444" stroke-width="5" rx="4"/>
          <text x="0" y="10" class="ui" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="3">
            CAUGHT IN 4K
          </text>
        </g>
      </g>
    </g>

    <!-- Bottom Diagnostics & Beveled Buttons -->
    <g transform="translate(14, 316)">
      <!-- Diagnostics Box -->
      <rect width="706" height="68" fill="#ffffff" stroke="#808080" stroke-width="2"/>
      <text x="14" y="22" class="mono" font-size="11" fill="#18181b">
        [CUDA 12.1 FP16] RTX 4050 6GB • Moondream2 Vision Vibe Vectorized • 1,800+ Semantic Anchors
      </text>
      <text x="14" y="42" class="mono" font-size="11" fill="#64748b">
        Status: Standalone Offline Inference Ready • PIL Dynamic Auto-Wrap Burner Active
      </text>
      <text x="14" y="60" class="mono" font-size="10" fill="#059669">
        ✔ React 19 Frontend (Vite / Win95 3D UI) Mounted at http://localhost:8000
      </text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(14, 394)">
      <rect width="160" height="26" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="80" y="17" class="ui" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">⚡ Capture Suspect</text>

      <rect x="180" y="0" width="160" height="26" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="260" y="17" class="ui" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">🔥 Synthesize Roast</text>

      <rect x="360" y="0" width="160" height="26" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="440" y="17" class="ui" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">💾 Export Burned Meme</text>

      <rect x="546" y="0" width="160" height="26" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="626" y="17" class="ui" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">🎮 RAGEWARE 98 Link</text>
    </g>
  </g>
</svg>
