<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1505"/>
      <stop offset="1" stop-color="#14280b"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .scanline{animation:scanDown 2.8s ease-in-out infinite alternate}
    @keyframes scanDown{from{transform:translateY(0)}to{transform:translateY(220px)}}
    .stamp-anim{animation:fakeStamp 5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
    @keyframes fakeStamp{
      0%,25%{transform:rotate(-12deg) scale(2.2);opacity:0}
      35%,85%{transform:rotate(-12deg) scale(1);opacity:1}
      95%,100%{transform:rotate(-12deg) scale(0.8);opacity:0}
    }
    .needle-sweep{animation:needleWiggle 3s ease-in-out infinite alternate}
    @keyframes needleWiggle{
      0%{transform:rotate(-40deg)}
      50%{transform:rotate(55deg)}
      100%{transform:rotate(70deg)}
    }
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Main Dashboard Frame -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="14" fill="#0f1f0a" stroke="#b8ee62" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Header Bar -->
    <rect x="0" y="0" width="740" height="46" rx="14" fill="#172e10"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="46" cy="23" r="6" fill="#facc15"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>
    <text x="88" y="28" class="mono" font-size="13" font-weight="bold" fill="#b8ee62">
      FAKE REVIEW DETECTOR // NLP FRAUD ANALYSIS ENGINE [RANDOM FOREST 87%]
    </text>

    <!-- Scraped Review Card -->
    <g transform="translate(24, 66)">
      <rect width="440" height="230" rx="10" fill="#13240e" stroke="#26451a" stroke-width="2"/>
      
      <!-- Review Metadata -->
      <g transform="translate(20, 20)">
        <text x="0" y="16" class="ui" font-size="14" font-weight="bold" fill="#f8fafc">
          Verified Buyer: "User_98421" on E-Commerce Marketplace
        </text>
        <text x="0" y="36" class="mono" font-size="11" fill="#84cc16">
          ★★★★★ "BEST PRODUCT EVER IN MY LIFE I AM SO AMAZED BUY 10 NOW"
        </text>
        <text x="0" y="65" class="ui" font-size="12" fill="#cbd5e1">
          Review Text: "This gadget transformed my soul! Absolutely 1000% genuine
        </text>
        <text x="0" y="85" class="ui" font-size="12" fill="#cbd5e1">
          miracle item. Seller is divine entity. Instant 5 stars must order fast."
        </text>

        <!-- NLP Semantic Breakdown -->
        <rect x="0" y="110" width="400" height="60" rx="6" fill="#0b1708"/>
        <text x="12" y="130" class="mono" font-size="11" fill="#b8ee62">
          TF-IDF Vector Density: Over-indexed Hyperbole (+4.8σ)
        </text>
        <text x="12" y="150" class="mono" font-size="11" fill="#f87171">
          Syntactic Anomaly Score: 94.2% Bot Generation Probability
        </text>
      </g>

      <!-- Scanning Line -->
      <g class="scanline">
        <line x1="0" y1="0" x2="440" y2="0" stroke="#b8ee62" stroke-width="2"/>
      </g>

      <!-- FAKE STAMP -->
      <g class="stamp-anim" transform="translate(220, 115)">
        <rect x="-105" y="-24" width="210" height="48" fill="none" stroke="#ef4444" stroke-width="5" rx="4"/>
        <text x="0" y="10" class="ui" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="3">
          FAKE DETECTED
        </text>
      </g>
    </g>

    <!-- Right Side: Gauge & Sentiment Meter -->
    <g transform="translate(485, 66)">
      <rect width="230" height="230" rx="10" fill="#13240e" stroke="#26451a" stroke-width="2"/>
      <text x="115" y="28" class="mono" font-size="11" font-weight="bold" fill="#b8ee62" text-anchor="middle">
        FRAUD PROBABILITY
      </text>

      <!-- Semi-circle Gauge -->
      <g transform="translate(115, 130)">
        <path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#223a18" stroke-width="16"/>
        <path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="url(#meter)" stroke-width="16" stroke-dasharray="251" stroke-dashoffset="30"/>
        
        <!-- Needle -->
        <g class="needle-sweep">
          <line x1="0" y1="0" x2="0" y2="-65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="8" fill="#b8ee62"/>
        </g>
      </g>

      <text x="115" y="170" class="mono" font-size="28" font-weight="900" fill="#ef4444" text-anchor="middle">
        87.4%
      </text>
      <text x="115" y="195" class="ui" font-size="11" fill="#94a3b8" text-anchor="middle">
        Classification: Synthesized Bot
      </text>
      <text x="115" y="212" class="mono" font-size="10" fill="#84cc16" text-anchor="middle">
        Model: Random Forest Ensemble
      </text>
    </g>

    <!-- Bottom Telemetry Pipeline -->
    <g transform="translate(24, 316)">
      <rect width="692" height="88" rx="8" fill="#13240e" stroke="#26451a" stroke-width="2"/>
      <text x="16" y="26" class="mono" font-size="11" fill="#b8ee62">
        &gt; Pipeline: Selenium WebScraper → Text Tokenization → TF-IDF Vectorizer → Scikit-learn Random Forest
      </text>
      <text x="16" y="48" class="mono" font-size="11" fill="#f8fafc">
        Flask Microservice: Active on port :5000 • Verified Review Corpus: 50,000+ Samples
      </text>
      <text x="16" y="70" class="mono" font-size="11" fill="#84cc16">
        [Status: 200 OK] Batch inference latency: 42ms per product catalog scan
      </text>
    </g>
  </g>
</svg>
