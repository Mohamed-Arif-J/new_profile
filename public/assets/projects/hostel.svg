<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141005"/>
      <stop offset="1" stop-color="#2a220a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .counter-fill{animation:barFill 4s ease-in-out infinite alternate}
    @keyframes barFill{from{width:20%}to{width:94%}}
    .glow-pulse{animation:glowAnim 2s ease-in-out infinite alternate}
    @keyframes glowAnim{from{opacity:0.4}to{opacity:1}}
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Java Swing Application Window -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="10" fill="#201a08" stroke="#f1c86a" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Java Window Title Bar -->
    <rect width="740" height="44" rx="10" fill="#30260b"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="46" cy="22" r="6" fill="#facc15"/>
    <circle cx="64" cy="22" r="6" fill="#22c55e"/>
    <text x="88" y="27" class="mono" font-size="13" font-weight="bold" fill="#f1c86a">
      SMART HOSTEL MANAGEMENT SYSTEM // JAVA SWING + MYSQL JDBC
    </text>

    <!-- Swing Grid: Room Allocation Matrix -->
    <g transform="translate(24, 62)">
      <rect width="440" height="240" rx="8" fill="#141005" stroke="#483811" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#f1c86a">
        [ROOM ALLOCATION MATRIX - BLOCK A &amp; B]
      </text>

      <!-- Room Cells -->
      <g transform="translate(16, 40)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="92" height="44" rx="4" fill="#059669"/>
        <text x="46" y="20" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A-101</text>
        <text x="46" y="34" class="mono" font-size="9" fill="#d1fae5" text-anchor="middle">OCCUPIED</text>

        <rect x="104" y="0" width="92" height="44" rx="4" fill="#059669"/>
        <text x="150" y="20" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A-102</text>
        <text x="150" y="34" class="mono" font-size="9" fill="#d1fae5" text-anchor="middle">OCCUPIED</text>

        <rect x="208" y="0" width="92" height="44" rx="4" fill="#0284c7"/>
        <text x="254" y="20" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A-103</text>
        <text x="254" y="34" class="mono" font-size="9" fill="#e0f2fe" text-anchor="middle">AVAILABLE</text>

        <rect x="312" y="0" width="92" height="44" rx="4" fill="#059669"/>
        <text x="358" y="20" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A-104</text>
        <text x="358" y="34" class="mono" font-size="9" fill="#d1fae5" text-anchor="middle">OCCUPIED</text>

        <!-- Row 2 -->
        <rect x="0" y="56" width="92" height="44" rx="4" fill="#059669"/>
        <text x="46" y="76" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B-201</text>
        <text x="46" y="90" class="mono" font-size="9" fill="#d1fae5" text-anchor="middle">OCCUPIED</text>

        <rect x="104" y="56" width="92" height="44" rx="4" fill="#d97706"/>
        <text x="150" y="76" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B-202</text>
        <text x="150" y="90" class="mono" font-size="9" fill="#fef3c7" text-anchor="middle">MAINTENANCE</text>

        <rect x="208" y="56" width="92" height="44" rx="4" fill="#059669"/>
        <text x="254" y="76" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B-203</text>
        <text x="254" y="90" class="mono" font-size="9" fill="#d1fae5" text-anchor="middle">OCCUPIED</text>

        <rect x="312" y="56" width="92" height="44" rx="4" fill="#0284c7"/>
        <text x="358" y="76" class="mono" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B-204</text>
        <text x="358" y="90" class="mono" font-size="9" fill="#e0f2fe" text-anchor="middle">AVAILABLE</text>

        <!-- Row 3: Progress Bar -->
        <rect x="0" y="116" width="404" height="24" rx="4" fill="#241c06"/>
        <rect class="counter-fill" x="0" y="116" width="40%" height="24" rx="4" fill="url(#bar)"/>
        <text x="202" y="132" class="mono" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">
          Total Hostel Occupancy: 94.2%
        </text>
      </g>
    </g>

    <!-- Right Side: Billing & JDBC Status -->
    <g transform="translate(485, 62)">
      <rect width="230" height="240" rx="8" fill="#141005" stroke="#483811" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#f1c86a">
        [MESS BILLING LOG]
      </text>

      <g transform="translate(16, 42)">
        <text x="0" y="16" class="ui" font-size="11" fill="#cbd5e1">Room 101: ₹ 3,450 [PAID]</text>
        <text x="0" y="38" class="ui" font-size="11" fill="#cbd5e1">Room 102: ₹ 3,450 [PAID]</text>
        <text x="0" y="60" class="ui" font-size="11" fill="#f87171">Room 104: ₹ 3,450 [PENDING]</text>
        <text x="0" y="82" class="ui" font-size="11" fill="#cbd5e1">Room 201: ₹ 3,200 [PAID]</text>
        <text x="0" y="104" class="ui" font-size="11" fill="#cbd5e1">Room 203: ₹ 3,450 [PAID]</text>

        <!-- Database Badge -->
        <rect x="0" y="126" width="198" height="42" rx="6" fill="#30260b" stroke="#f1c86a" stroke-width="1"/>
        <circle cx="16" cy="147" r="5" fill="#22c55e" class="glow-pulse"/>
        <text x="28" y="144" class="mono" font-size="10" font-weight="bold" fill="#f1c86a">MySQL JDBC Engine</text>
        <text x="28" y="158" class="mono" font-size="9" fill="#94a3b8">PreparedStatements · Pool OK</text>
      </g>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 320)">
      <rect width="692" height="82" rx="8" fill="#141005" stroke="#483811" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" fill="#f1c86a">
        Enterprise Architecture: Java Swing GUI • Custom Component Models • Tiered Role-Based Access Control
      </text>
      <text x="16" y="46" class="mono" font-size="11" fill="#f8fafc">
        Features: Automated Room Allocation • Mess Billing Calculations • Student Attendance &amp; Leave Records
      </text>
      <text x="16" y="68" class="mono" font-size="11" fill="#059669">
        ✔ High-Stability Offline Desktop Enterprise Client with MySQL Relational Storage
      </text>
    </g>
  </g>
</svg>
