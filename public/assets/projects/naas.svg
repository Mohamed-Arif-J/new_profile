<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140700"/>
      <stop offset="1" stop-color="#2a0f00"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .pulse-btn{animation:btnPulse 2.2s ease-in-out infinite alternate}
    @keyframes btnPulse{from{transform:scale(0.98)}to{transform:scale(1.03)}}
    .void-spin{animation:spinVoid 8s linear infinite}
    @keyframes spinVoid{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Main SaaS Card -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="14" fill="#1f0b00" stroke="#f97316" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Header -->
    <rect width="740" height="46" rx="14" fill="#331200"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="46" cy="23" r="6" fill="#facc15"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>
    <text x="88" y="28" class="mono" font-size="13" font-weight="bold" fill="#f97316">
      NaaS // NOTHING AS A SERVICE [THE PREMIER SERVERLESS ABSENCE PLATFORM]
    </text>

    <!-- Center Hero Callout -->
    <g transform="translate(370, 135)">
      <!-- Void Vortex -->
      <g class="void-spin">
        <circle cx="0" cy="0" r="48" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="16 10"/>
        <circle cx="0" cy="0" r="32" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6"/>
      </g>
      <circle cx="0" cy="0" r="14" fill="#000000"/>
      <text x="0" y="70" class="ui" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">
        We Deliver Absolutely Nothing. Guaranteed.
      </text>
      <text x="0" y="92" class="ui" font-size="13" fill="#fdba74" text-anchor="middle">
        0% Uptime Needed • 0 Errors Possible • 100% Resource Reduction
      </text>
    </g>

    <!-- Pricing Tier Cards -->
    <g transform="translate(40, 255)">
      <!-- Tier 1 -->
      <rect x="0" y="0" width="200" height="120" rx="8" fill="#140700" stroke="#431407" stroke-width="2"/>
      <text x="100" y="26" class="ui" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Standard Nothing</text>
      <text x="100" y="56" class="mono" font-size="22" font-weight="900" fill="#ea580c" text-anchor="middle">$0 / mo</text>
      <text x="100" y="80" class="ui" font-size="11" fill="#fed7aa" text-anchor="middle">Zero bytes delivered</text>
      <text x="100" y="96" class="ui" font-size="11" fill="#9a3412" text-anchor="middle">Unlimited silence</text>

      <!-- Tier 2 (Highlighted) -->
      <rect x="230" y="-10" width="200" height="140" rx="8" fill="#2c0d02" stroke="#f97316" stroke-width="3"/>
      <rect x="270" y="-20" width="120" height="20" rx="10" fill="#f97316"/>
      <text x="330" y="-6" class="mono" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">MOST POPULAR</text>
      <text x="330" y="24" class="ui" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Enterprise Nothing</text>
      <text x="330" y="56" class="mono" font-size="22" font-weight="900" fill="#fb923c" text-anchor="middle">$999 / mo</text>
      <text x="330" y="80" class="ui" font-size="11" fill="#fed7aa" text-anchor="middle">VIP Priority Nothing</text>
      <text x="330" y="100" class="ui" font-size="11" fill="#4ade80" text-anchor="middle">Dedicated Void SLA</text>

      <!-- Tier 3 -->
      <rect x="460" y="0" width="200" height="120" rx="8" fill="#140700" stroke="#431407" stroke-width="2"/>
      <text x="560" y="26" class="ui" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Quantum Nothing</text>
      <text x="560" y="56" class="mono" font-size="22" font-weight="900" fill="#ea580c" text-anchor="middle">$9,999 / mo</text>
      <text x="560" y="80" class="ui" font-size="11" fill="#fed7aa" text-anchor="middle">Nothing &amp; Everything</text>
      <text x="560" y="96" class="ui" font-size="11" fill="#9a3412" text-anchor="middle">Schrödinger Guarantee</text>
    </g>

    <!-- Bottom satirical tagline -->
    <text x="370" y="405" class="mono" font-size="11" fill="#ea580c" text-anchor="middle">
      Satirical Product Landing Page • High-Conversion SaaS Storytelling Experiment
    </text>
  </g>
</svg>
