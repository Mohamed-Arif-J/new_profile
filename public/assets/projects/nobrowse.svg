<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#005050"/>
    </linearGradient>
    <linearGradient id="winTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#800080"/>
      <stop offset="100%" stop-color="#ba55d3"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .bsod-flicker{animation:bsodFlash 7s infinite}
    @keyframes bsodFlash{
      0%,35%{opacity:0;transform:scale(0.92);pointer-events:none}
      40%,88%{opacity:1;transform:scale(1);pointer-events:auto}
      96%,100%{opacity:0;transform:scale(0.92);pointer-events:none}
    }
    .progress-chaos{animation:barCrawl 7s ease-in-out infinite}
    @keyframes barCrawl{
      0%{width:0%}
      20%{width:40%}
      30%{width:99%}
      35%,100%{width:99%}
    }
    .cursor-blink{animation:blink 0.8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pacman-bob{animation:pacmanChomp 0.6s infinite alternate}
    @keyframes pacmanChomp{from{transform:rotate(0deg)}to{transform:rotate(20deg)}}
  </style>

  <!-- Desktop Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Win95 Browser Window -->
  <g transform="translate(35, 25)">
    <!-- Beveled Window Frame -->
    <rect width="730" height="420" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="3" filter="drop-shadow(3px 5px 14px rgba(0,0,0,0.45))"/>
    <rect x="2" y="2" width="726" height="416" fill="none" stroke="#808080" stroke-width="2"/>

    <!-- Title Bar -->
    <rect x="4" y="4" width="722" height="28" fill="url(#winTitle)"/>
    <text x="14" y="23" class="ui" font-size="13" font-weight="bold" fill="#ffffff">
      🌐 NOBROWSE™ - [40% Useful | 60% Chaos Decision Engine]
    </text>
    <g transform="translate(660, 7)">
      <rect width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="9" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">_</text>
      <rect x="22" y="0" width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="31" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">□</text>
      <rect x="44" y="0" width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="53" y="14" class="ui" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">✕</text>
    </g>

    <!-- Menu Bar -->
    <rect x="4" y="32" width="722" height="22" fill="#d4d0c8"/>
    <text x="14" y="47" class="ui" font-size="11" fill="#000">File   Edit   View   Chaos-Settings   Audio   Help</text>
    <line x1="4" y1="54" x2="726" y2="54" stroke="#808080" stroke-width="1"/>

    <!-- Navigation Chrome & Address Bar -->
    <g transform="translate(8, 60)">
      <!-- Back / Forward / Reload / Home Buttons -->
      <rect width="28" height="24" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="14" y="17" class="ui" font-size="12" font-weight="bold" text-anchor="middle">←</text>

      <rect x="32" y="0" width="28" height="24" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="46" y="17" class="ui" font-size="12" font-weight="bold" text-anchor="middle">→</text>

      <rect x="64" y="0" width="28" height="24" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="78" y="17" class="ui" font-size="12" font-weight="bold" text-anchor="middle">⟳</text>

      <rect x="96" y="0" width="28" height="24" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
      <text x="110" y="17" class="ui" font-size="12" font-weight="bold" text-anchor="middle">🏠</text>

      <!-- URL Address Bar -->
      <rect x="132" y="0" width="460" height="24" fill="#ffffff" stroke="#808080" stroke-width="2"/>
      <text x="142" y="16" class="mono" font-size="11" fill="#18181b">
        noexplore://search?q=how+to+fix+bugs
      </text>

      <!-- Probability Pill -->
      <rect x="600" y="0" width="112" height="24" fill="#18181b" rx="2"/>
      <text x="656" y="16" class="mono" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">
        CHAOS: 60%
      </text>
    </g>

    <!-- Browser Viewport Canvas -->
    <g transform="translate(10, 94)">
      <rect width="708" height="312" fill="#ffffff" stroke="#808080" stroke-width="2"/>

      <!-- 40% Useful Under-layer (SERP results being rendered) -->
      <g transform="translate(24, 20)">
        <text x="0" y="16" class="ui" font-size="16" font-weight="bold" fill="#1e3a8a">
          Search Results: "how to fix bugs"
        </text>
        <text x="0" y="34" class="ui" font-size="11" fill="#15803d">
          https://nobrowse.org/simulated/stackoverflow/question-8492
        </text>
        <text x="0" y="52" class="ui" font-size="12" fill="#334155">
          Step 1: Close your laptop. Step 2: Explain problem to yellow rubber duck...
        </text>

        <!-- Uncooperative 99% Loading Bar -->
        <rect x="0" y="74" width="660" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
        <rect class="progress-chaos" x="0" y="74" width="0%" height="18" fill="#3b82f6"/>
        <text x="330" y="88" class="mono" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">
          Loading 99% - The browser got bored...
        </text>
      </g>

      <!-- 60% CHAOS MODE OVERLAY: Win95 BSOD & Pac-Man Sound Synthesis -->
      <g class="bsod-flicker" transform="translate(20, 16)">
        <rect width="668" height="280" fill="#0000aa" stroke="#ffffff" stroke-width="3" filter="drop-shadow(4px 6px 16px rgba(0,0,0,0.6))"/>
        
        <rect x="234" y="20" width="200" height="30" fill="#aaaaaa"/>
        <text x="334" y="41" class="mono" font-size="14" font-weight="bold" fill="#0000aa" text-anchor="middle">
          *** STOP: 0xWHY ***
        </text>

        <text x="30" y="85" class="mono" font-size="12" fill="#ffffff">
          A problem has been detected and NOBROWSE has been shut down to prevent
        </text>
        <text x="30" y="105" class="mono" font-size="12" fill="#ffffff">
          damage to your patience. The Chaos Engine rolled &gt; 0.40 probability.
        </text>

        <text x="30" y="140" class="mono" font-size="12" font-weight="bold" fill="#facc15">
          ERROR_CODE: 0xOUT-OF-CHEESE-ERROR [Web Audio API: Pac-Man Death Synthesized]
        </text>

        <!-- Pac-Man Animation -->
        <g transform="translate(60, 200)">
          <circle cx="0" cy="0" r="22" fill="#facc15"/>
          <path d="M0 0 L22 -14 A22 22 0 0 1 22 14 Z" fill="#0000aa" class="pacman-bob"/>
          <circle cx="2" cy="-10" r="3" fill="#000"/>
          <!-- Ghosts fleeing -->
          <text x="60" y="8" class="mono" font-size="20">👻 👻 👻</text>
        </g>

        <!-- Dialog button -->
        <g transform="translate(380, 190)">
          <rect width="240" height="34" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
          <text x="120" y="22" class="ui" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">
            Press Any Key To Panic
          </text>
        </g>

        <text x="30" y="260" class="mono" font-size="11" fill="#93c5fd">
          Press CTRL+ALT+DEL to restart your browser, or enjoy the music.<span class="cursor-blink">_</span>
        </text>
      </g>
    </g>
  </g>
</svg>
