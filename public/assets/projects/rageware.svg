<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#005a5a"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#1084d0"/>
    </linearGradient>
  </defs>
  <!-- Desktop Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Retro Desktop Icons -->
  <g transform="translate(30, 30)">
    <rect width="44" height="44" rx="4" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <text x="22" y="28" font-family="monospace" font-size="20" text-anchor="middle" fill="#000">💾</text>
    <text x="22" y="60" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">My PC</text>
  </g>
  <g transform="translate(30, 115)">
    <rect width="44" height="44" rx="4" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <text x="22" y="28" font-family="monospace" font-size="20" text-anchor="middle" fill="#000">📁</text>
    <text x="22" y="60" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Projects</text>
  </g>
  <g transform="translate(30, 200)">
    <rect width="44" height="44" rx="4" fill="#c0c0c0" stroke="#fff" stroke-width="2"/>
    <text x="22" y="28" font-family="monospace" font-size="20" text-anchor="middle" fill="#000">🎮</text>
    <text x="22" y="60" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Doom.exe</text>
  </g>
  
  <!-- Main Retro Window: RageWare OS -->
  <g transform="translate(130, 45)">
    <!-- Window Frame -->
    <rect width="610" height="360" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="3" filter="drop-shadow(4px 6px 16px rgba(0,0,0,0.5))"/>
    <rect x="2" y="2" width="606" height="356" fill="none" stroke="#808080" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="4" y="4" width="602" height="28" fill="url(#titleBar)"/>
    <text x="16" y="23" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🎯 RageWare OS - Version 1.9.95 [AltF4 System Shell]</text>
    
    <!-- Window Control Buttons -->
    <g transform="translate(540, 7)">
      <rect width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="9" y="14" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">_</text>
    </g>
    <g transform="translate(562, 7)">
      <rect width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="9" y="14" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">□</text>
    </g>
    <g transform="translate(584, 7)">
      <rect width="18" height="18" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
      <text x="9" y="14" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">✕</text>
    </g>
    
    <!-- Window Menu Bar -->
    <rect x="4" y="32" width="602" height="22" fill="#d4d0c8"/>
    <text x="16" y="47" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#000">File   Edit   View   Applications   Options   Help</text>
    <line x1="4" y1="54" x2="606" y2="54" stroke="#808080" stroke-width="1"/>
    
    <!-- Window Inner Canvas / Terminal -->
    <rect x="14" y="64" width="582" height="280" fill="#0c1017" rx="3"/>
    
    <!-- Terminal Text -->
    <text x="32" y="98" font-family="Consolas, monospace" font-size="14" fill="#c4f042">> RAGEWARE_OS INITIALIZED SUCCESSFULLY</text>
    <text x="32" y="124" font-family="Consolas, monospace" font-size="12" fill="#8892b0">Architecture: Web Audio API • Virtual Window Manager • Retro Apps</text>
    <text x="32" y="148" font-family="Consolas, monospace" font-size="12" fill="#8892b0">Lead Architect: Mohamed Arif J (AltF4 Team)</text>
    <text x="32" y="180" font-family="Consolas, monospace" font-size="13" fill="#54e0d6">[✓] Webamp MP3 Player Loaded</text>
    <text x="32" y="204" font-family="Consolas, monospace" font-size="13" fill="#54e0d6">[✓] Virtual File Explorer Mounted (/C:/RAGEWARE)</text>
    <text x="32" y="228" font-family="Consolas, monospace" font-size="13" fill="#54e0d6">[✓] CRT Shader Engine &amp; Scanlines Enabled</text>
    <text x="32" y="260" font-family="Consolas, monospace" font-size="13" fill="#f59e0b">> Type 'help' or click any desktop icon to launch interactive retro apps</text>
    <rect x="32" y="280" width="10" height="18" fill="#c4f042">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Taskbar -->
  <rect x="0" y="444" width="800" height="36" fill="#c0c0c0" stroke="#fff" stroke-width="1"/>
  <!-- Start Button -->
  <g transform="translate(4, 447)">
    <rect width="72" height="28" fill="#c0c0c0" stroke="#fff" stroke-width="2" rx="2"/>
    <text x="14" y="19" font-family="sans-serif" font-size="14">🪟</text>
    <text x="34" y="19" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#000">Start</text>
  </g>
  <!-- Active Task -->
  <g transform="translate(84, 447)">
    <rect width="160" height="28" fill="#d4d0c8" stroke="#808080" stroke-width="2" rx="2"/>
    <text x="96" y="19" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#000">🎯 RageWare OS</text>
  </g>
  <!-- Clock Tray -->
  <g transform="translate(710, 449)">
    <rect width="82" height="24" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <text x="751" y="16" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#000">11:42 PM</text>
  </g>
</svg>
