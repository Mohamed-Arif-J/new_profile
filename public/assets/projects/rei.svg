<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0515"/>
      <stop offset="1" stop-color="#180c35"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .orb-pulse{animation:pulseGlow 2.5s ease-in-out infinite alternate}
    @keyframes pulseGlow{
      from{transform:scale(0.92);filter:drop-shadow(0 0 15px rgba(168,85,247,0.4))}
      to{transform:scale(1.08);filter:drop-shadow(0 0 35px rgba(168,85,247,0.9))}
    }
    .wave-bar{animation:waveJump 1.2s ease-in-out infinite alternate}
    @keyframes waveJump{from{height:8px}to{height:42px}}
    .typing-cursor{animation:blinkCur 0.9s steps(1) infinite}
    @keyframes blinkCur{50%{opacity:0}}
    .cmd-type{animation:cmdStream 7s infinite}
    @keyframes cmdStream{
      0%,15%{opacity:0}
      20%,90%{opacity:1}
      100%{opacity:0}
    }
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Main Window -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="14" fill="#110924" stroke="#a855f7" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Title Bar -->
    <rect width="740" height="46" rx="14" fill="#1e103f"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="46" cy="23" r="6" fill="#facc15"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>
    <text x="88" y="28" class="mono" font-size="13" font-weight="bold" fill="#aa8bff">
      REI AI ASSISTANT // HYBRID OFFLINE LLM (OLLAMA + QWEN2.5 + FASTAPI)
    </text>

    <!-- Center AI Orb Core -->
    <g transform="translate(180, 155)">
      <circle cx="0" cy="0" r="54" fill="url(#orb)" class="orb-pulse"/>
      <circle cx="0" cy="0" r="38" fill="#180c35" opacity="0.6"/>
      <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.85"/>
      <text x="0" y="80" class="mono" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">
        REI NEURAL CORE
      </text>
      <text x="0" y="96" class="mono" font-size="10" fill="#94a3b8" text-anchor="middle">
        Offline-First Privacy Mode Active
      </text>
    </g>

    <!-- Audio Visualizer Waveforms -->
    <g transform="translate(100, 275)" fill="#aa8bff">
      <rect x="0" y="0" width="6" height="15" rx="3" class="wave-bar" style="animation-delay: 0.1s"/>
      <rect x="12" y="0" width="6" height="28" rx="3" class="wave-bar" style="animation-delay: 0.3s"/>
      <rect x="24" y="0" width="6" height="38" rx="3" class="wave-bar" style="animation-delay: 0.5s"/>
      <rect x="36" y="0" width="6" height="18" rx="3" class="wave-bar" style="animation-delay: 0.2s"/>
      <rect x="48" y="0" width="6" height="42" rx="3" class="wave-bar" style="animation-delay: 0.7s"/>
      <rect x="60" y="0" width="6" height="24" rx="3" class="wave-bar" style="animation-delay: 0.4s"/>
      <rect x="72" y="0" width="6" height="34" rx="3" class="wave-bar" style="animation-delay: 0.6s"/>
      <rect x="84" y="0" width="6" height="16" rx="3" class="wave-bar" style="animation-delay: 0.15s"/>
      <rect x="96" y="0" width="6" height="38" rx="3" class="wave-bar" style="animation-delay: 0.8s"/>
      <rect x="108" y="0" width="6" height="22" rx="3" class="wave-bar" style="animation-delay: 0.25s"/>
      <rect x="120" y="0" width="6" height="40" rx="3" class="wave-bar" style="animation-delay: 0.45s"/>
      <rect x="132" y="0" width="6" height="14" rx="3" class="wave-bar" style="animation-delay: 0.35s"/>
      <rect x="144" y="0" width="6" height="32" rx="3" class="wave-bar" style="animation-delay: 0.65s"/>
      <rect x="156" y="0" width="6" height="20" rx="3" class="wave-bar" style="animation-delay: 0.2s"/>
    </g>

    <!-- Terminal Command Execution Log -->
    <g transform="translate(350, 66)">
      <rect width="365" height="245" rx="8" fill="#080312" stroke="#3b1d6e" stroke-width="2"/>
      
      <!-- Terminal Header -->
      <rect width="365" height="26" rx="8" fill="#190c30"/>
      <text x="12" y="18" class="mono" font-size="10" fill="#c084fc">bash: rei@local-core: ~</text>

      <!-- Terminal Content -->
      <g transform="translate(14, 45)">
        <text x="0" y="16" class="mono" font-size="11" fill="#4ade80">> User: "Rei, summarize today's git commits"</text>
        <text x="0" y="38" class="mono" font-size="11" fill="#aa8bff">&gt; [Ollama]: Routing to Qwen2.5-0.5B-Instruct</text>
        
        <g class="cmd-type">
          <text x="0" y="60" class="mono" font-size="11" fill="#e2e8f0">&gt; Executing OS tool: git log -n 5 --oneline</text>
          <text x="0" y="82" class="mono" font-size="11" fill="#38bdf8">&gt; Tool Output: 5 commits parsed successfully</text>
          <text x="0" y="104" class="mono" font-size="11" fill="#facc15">> Rei: "You engineered 5 features today:</text>
          <text x="0" y="124" class="mono" font-size="11" fill="#facc15">  - Added Skipper theme transition</text>
          <text x="0" y="144" class="mono" font-size="11" fill="#facc15">  - Integrated GitHub heatmap graph</text>
          <text x="0" y="164" class="mono" font-size="11" fill="#facc15">  - Deployed offline AI services."</text>
        </g>

        <text x="0" y="188" class="mono" font-size="11" fill="#4ade80">&gt; Status: 200 OK (Inference: 142 tok/s)<span class="typing-cursor">_</span></text>
      </g>
    </g>

    <!-- Bottom Architecture Stats -->
    <g transform="translate(24, 330)">
      <rect width="692" height="75" rx="8" fill="#180c35" stroke="#3b1d6e" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" fill="#aa8bff">
        Local Stack: Python 3.11 • FastAPI Async Engine • Ollama Daemon • Qwen2.5 0.5B / 7B Fallback
      </text>
      <text x="16" y="44" class="mono" font-size="11" fill="#e2e8f0">
        System Capabilities: Automated File Operations • OS Command Shell • Real-Time Web Fallback
      </text>
      <text x="16" y="64" class="mono" font-size="11" fill="#4ade80">
        ✔ Zero Data Telemetry to Cloud • 100% On-Device Personal Assistant
      </text>
    </g>
  </g>
</svg>
