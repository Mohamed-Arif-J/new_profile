<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0418"/>
      <stop offset="1" stop-color="#190930"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:Consolas,monospace,sans-serif}
    .ui{font-family:'Segoe UI',Tahoma,sans-serif}
    .curve-draw{stroke-dasharray:600;animation:drawCurve 4s ease-in-out infinite alternate}
    @keyframes drawCurve{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
    .dot-pop{animation:popScatter 2s ease-in-out infinite alternate}
    @keyframes popScatter{from{r:3}to{r:6}}
  </style>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Analytics Shell -->
  <g transform="translate(30, 25)">
    <rect width="740" height="430" rx="14" fill="#150726" stroke="#a855f7" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Header -->
    <rect width="740" height="46" rx="14" fill="#240c42"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444"/>
    <circle cx="46" cy="23" r="6" fill="#facc15"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>
    <text x="88" y="28" class="mono" font-size="13" font-weight="bold" fill="#c084fc">
      SCREEN ADDICTION GBDT PIPELINE // LIGHTGBM BEHAVIORAL ANALYTICS [91.8% PRECISION]
    </text>

    <!-- Left Chart: ROC-AUC Predictive Curve -->
    <g transform="translate(24, 66)">
      <rect width="400" height="240" rx="8" fill="#0d031c" stroke="#3b1668" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#c084fc">
        [ROC-AUC CLASSIFICATION CURVE // AUC = 0.942]
      </text>

      <!-- Axes -->
      <g stroke="#4c1d85" stroke-width="2">
        <line x1="45" y1="45" x2="45" y2="200"/>
        <line x1="45" y1="200" x2="360" y2="200"/>
      </g>
      <!-- Reference diagonal -->
      <line x1="45" y1="200" x2="360" y2="45" stroke="#371761" stroke-width="1.5" stroke-dasharray="6 6"/>

      <!-- Animated ROC Curve -->
      <path class="curve-draw" d="M45 200 C55 90 90 55 200 48 S320 46 360 45" fill="none" stroke="url(#curve)" stroke-width="4"/>

      <!-- Labels -->
      <text x="18" y="125" class="mono" font-size="9" fill="#94a3b8" transform="rotate(-90 18 125)">True Positive Rate</text>
      <text x="180" y="222" class="mono" font-size="9" fill="#94a3b8">False Positive Rate</text>
    </g>

    <!-- Right Side: Feature Importance Matrix -->
    <g transform="translate(445, 66)">
      <rect width="270" height="240" rx="8" fill="#0d031c" stroke="#3b1668" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#c084fc">
        [LIGHTGBM FEATURE IMPORTANCE]
      </text>

      <!-- Feature Bars -->
      <g transform="translate(16, 46)">
        <text x="0" y="14" class="mono" font-size="10" fill="#e2e8f0">Nightly Screen Pickups</text>
        <rect x="0" y="20" width="220" height="12" rx="3" fill="#a855f7"/>

        <text x="0" y="52" class="mono" font-size="10" fill="#e2e8f0">Dopamine App Switch Freq</text>
        <rect x="0" y="58" width="180" height="12" rx="3" fill="#ec4899"/>

        <text x="0" y="90" class="mono" font-size="10" fill="#e2e8f0">Continuous Session Duration</text>
        <rect x="0" y="96" width="145" height="12" rx="3" fill="#8b5cf6"/>

        <text x="0" y="128" class="mono" font-size="10" fill="#e2e8f0">First Pickup Latency Post-Wake</text>
        <rect x="0" y="134" width="115" height="12" rx="3" fill="#6366f1"/>

        <text x="0" y="166" class="mono" font-size="10" fill="#4ade80">Overall Model Precision: 91.8%</text>
      </g>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 324)">
      <rect width="692" height="80" rx="8" fill="#0d031c" stroke="#3b1668" stroke-width="2"/>
      <text x="16" y="24" class="mono" font-size="11" fill="#c084fc">
        ML Architecture: LightGBM Gradient Boosted Decision Trees • Scikit-learn • Pandas Data Pipeline
      </text>
      <text x="16" y="46" class="mono" font-size="11" fill="#f8fafc">
        Evaluation Metrics: Comprehensive K-Fold Cross Validation • Automated Behavioral Habit PDF Reports
      </text>
      <text x="16" y="68" class="mono" font-size="11" fill="#4ade80">
        ✔ Precision-Optimized Multi-Platform Behavioral Analytics Pipeline
      </text>
    </g>
  </g>
</svg>
