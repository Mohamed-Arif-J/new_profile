<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c1427"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="indigoNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowPlate1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="glowPlate2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#dbBg)"/>
  
  <!-- Subtle Ambient Light Orb -->
  <circle cx="680" cy="180" r="260" fill="url(#ambientOrb)"/>

  <!-- Perspective Grid Wireframe -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Top Studio Bar -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="#0f172a" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
  
  <!-- Mini Isometric Database Logo in Header -->
  <g transform="translate(42, 28) scale(0.55)">
    <path d="M17 32 C17 28 47 28 47 32 L47 37 C47 41 17 41 17 37 Z" fill="url(#indigoNeon)"/>
    <path d="M17 22 C17 18 47 18 47 22 L47 27 C47 31 17 31 17 27 Z" fill="url(#glowPlate1)"/>
    <ellipse cx="32" cy="14" rx="15" ry="4.5" fill="#e0f2fe"/>
    <ellipse cx="32" cy="14" rx="13" ry="3.8" fill="url(#cyanNeon)"/>
    <path d="M33 11 L28 23 L35 24 L30 36 L37 25 L30 24 Z" fill="#ffffff"/>
  </g>

  <text x="82" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.5">SHADOW<tspan fill="#38bdf8">DB</tspan></text>
  <text x="195" y="52" font-family="monospace" font-size="11" fill="#64748b">| Text-to-SQL Studio</text>

  <!-- Badges on Header Right -->
  <g transform="translate(480, 34)">
    <rect width="138" height="24" rx="12" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" font-family="monospace" font-size="10.5" font-weight="700" fill="#34d399">WASM SANDBOX OK</text>
  </g>
  <g transform="translate(628, 34)">
    <rect width="135" height="24" rx="12" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="67" y="16" font-family="monospace" font-size="10.5" font-weight="700" fill="#c084fc" text-anchor="middle">QWEN 2.5 CODER 7B</text>
  </g>

  <!-- Main Left Card: Prompt & Intent Pipeline -->
  <g transform="translate(25, 90)">
    <rect width="335" height="365" rx="16" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Card Title -->
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.5">NATURAL LANGUAGE PROMPT</text>
    
    <!-- User Prompt Input Container -->
    <rect x="20" y="48" width="295" height="74" rx="10" fill="#141f36" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="32" y="74" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">"Find all premium customers who</text>
    <text x="32" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">placed over 5 orders this quarter."</text>
    <circle cx="298" cy="108" r="4" fill="#38bdf8"/>

    <!-- 6-Stage Execution Pipeline Indicators -->
    <text x="20" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94a3b8">EXECUTION TIMELINE</text>

    <!-- Stage 1 -->
    <g transform="translate(20, 168)">
      <circle cx="12" cy="12" r="8" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="28" y="16" font-family="monospace" font-size="11" fill="#e2e8f0">1. Schema DDL Injection</text>
      <text x="250" y="16" font-family="monospace" font-size="10" fill="#38bdf8">0.4ms</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(20, 202)">
      <circle cx="12" cy="12" r="8" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3.5" fill="#a855f7"/>
      <text x="28" y="16" font-family="monospace" font-size="11" fill="#e2e8f0">2. Local Qwen 2.5 Inference</text>
      <text x="250" y="16" font-family="monospace" font-size="10" fill="#a855f7">18ms</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(20, 236)">
      <circle cx="12" cy="12" r="8" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="28" y="16" font-family="monospace" font-size="11" fill="#e2e8f0">3. AST Safety Guardrails</text>
      <text x="250" y="16" font-family="monospace" font-size="10" fill="#10b981">SAFE</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(20, 270)">
      <circle cx="12" cy="12" r="8" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3.5" fill="#f59e0b"/>
      <text x="28" y="16" font-family="monospace" font-size="11" fill="#e2e8f0">4. Forked WASM Sandbox</text>
      <text x="250" y="16" font-family="monospace" font-size="10" fill="#f59e0b">sql.js</text>
    </g>

    <!-- Git Snapshot State Bar -->
    <rect x="20" y="308" width="295" height="42" rx="8" fill="#111c33" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <text x="32" y="326" font-family="monospace" font-size="10" fill="#64748b">COMMIT SNAPSHOT #48a9fc</text>
    <text x="32" y="340" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">1-Click Immutable State Rollback Ready</text>
  </g>

  <!-- Main Right Card: SQL Editor & Output Terminal -->
  <g transform="translate(380, 90)">
    <rect width="395" height="365" rx="16" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Code Editor Header -->
    <rect x="0" y="0" width="395" height="38" rx="16" fill="#131c31"/>
    <circle cx="20" cy="19" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="19" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="19" r="4.5" fill="#10b981"/>
    <text x="70" y="23" font-family="monospace" font-size="11" fill="#94a3b8">synthesized_query.sql (Sandbox Dry-Run)</text>

    <!-- Synthesized SQL Code -->
    <g transform="translate(20, 56)" font-family="'JetBrains Mono', monospace" font-size="11.5">
      <text y="16"><tspan fill="#38bdf8" font-weight="700">SELECT</tspan> <tspan fill="#e2e8f0">c.id, c.name, </tspan><tspan fill="#38bdf8" font-weight="700">COUNT</tspan><tspan fill="#e2e8f0">(o.id) </tspan><tspan fill="#818cf8">AS</tspan><tspan fill="#e2e8f0"> orders,</tspan></text>
      <text y="36"><tspan fill="#e2e8f0">       </tspan><tspan fill="#38bdf8" font-weight="700">SUM</tspan><tspan fill="#e2e8f0">(o.total_amount) </tspan><tspan fill="#818cf8">AS</tspan><tspan fill="#e2e8f0"> lifetime_val</tspan></text>
      <text y="56"><tspan fill="#38bdf8" font-weight="700">FROM</tspan> <tspan fill="#facc15">customers</tspan> <tspan fill="#e2e8f0">c</tspan></text>
      <text y="76"><tspan fill="#818cf8" font-weight="700">JOIN</tspan> <tspan fill="#facc15">orders</tspan> <tspan fill="#e2e8f0">o </tspan><tspan fill="#818cf8" font-weight="700">ON</tspan> <tspan fill="#e2e8f0">c.id = o.customer_id</tspan></text>
      <text y="96"><tspan fill="#38bdf8" font-weight="700">WHERE</tspan> <tspan fill="#e2e8f0">o.created_at &gt;= </tspan><tspan fill="#4ade80">'2026-01-01'</tspan></text>
      <text y="116"><tspan fill="#38bdf8" font-weight="700">GROUP BY</tspan> <tspan fill="#e2e8f0">c.id, c.name</tspan></text>
      <text y="136"><tspan fill="#38bdf8" font-weight="700">HAVING</tspan> <tspan fill="#e2e8f0">orders &gt; </tspan><tspan fill="#f43f5e">5</tspan><tspan fill="#e2e8f0">;</tspan></text>
    </g>

    <!-- Sandbox Execution Results Table Preview -->
    <rect x="18" y="215" width="359" height="135" rx="10" fill="#090f1d" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="18" y="215" width="359" height="26" rx="10" fill="#131e34"/>
    <text x="32" y="232" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8">ID</text>
    <text x="75" y="232" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8">NAME</text>
    <text x="210" y="232" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8">ORDERS</text>
    <text x="290" y="232" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8">LTV</text>

    <!-- Row 1 -->
    <text x="32" y="258" font-family="monospace" font-size="10" fill="#e2e8f0">#104</text>
    <text x="75" y="258" font-family="monospace" font-size="10" fill="#e2e8f0">Acme Logistics Corp</text>
    <text x="220" y="258" font-family="monospace" font-size="10" fill="#38bdf8">14</text>
    <text x="290" y="258" font-family="monospace" font-size="10" fill="#4ade80">$28,490</text>

    <!-- Row 2 -->
    <text x="32" y="282" font-family="monospace" font-size="10" fill="#e2e8f0">#218</text>
    <text x="75" y="282" font-family="monospace" font-size="10" fill="#e2e8f0">Nexus Cloud Systems</text>
    <text x="220" y="282" font-family="monospace" font-size="10" fill="#38bdf8">9</text>
    <text x="290" y="282" font-family="monospace" font-size="10" fill="#4ade80">$14,220</text>

    <!-- Row 3 -->
    <text x="32" y="306" font-family="monospace" font-size="10" fill="#e2e8f0">#305</text>
    <text x="75" y="306" font-family="monospace" font-size="10" fill="#e2e8f0">Solaria Robotics Inc</text>
    <text x="220" y="306" font-family="monospace" font-size="10" fill="#38bdf8">8</text>
    <text x="290" y="306" font-family="monospace" font-size="10" fill="#4ade80">$19,650</text>

    <!-- Bottom Status Note -->
    <g transform="translate(32, 332)">
      <circle cx="4" cy="4" r="3" fill="#10b981"/>
      <text x="14" y="8" font-family="monospace" font-size="9.5" fill="#34d399">Sandbox trial successful (3 rows returned). Safe to promote.</text>
    </g>
  </g>
</svg>
